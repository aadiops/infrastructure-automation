# Infrastructure Automation Platform

A production-focused DevOps portfolio project designed to showcase infrastructure automation, secure cloud provisioning, Kubernetes deployment, and CI/CD workflows.

## Project Overview

This repository demonstrates a modern cloud-native engineering workflow using:

- Terraform for infrastructure provisioning
- Ansible for configuration management
- Docker for application packaging
- Kubernetes for orchestration
- GitHub Actions for automation and validation
- Python Flask for a lightweight service layer

The goal is to present a polished, enterprise-style portfolio project that highlights practical DevOps experience for cloud, platform, and infrastructure engineering roles.

