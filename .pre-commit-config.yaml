## Core Capabilities

### Infrastructure as Code
- Reusable Terraform definitions for networking, security, and IAM policies
- Version-controlled cloud infrastructure for repeatable deployments

### Configuration Automation
- Ansible provisioning for baseline server configuration and service setup
- Declarative process for consistent environment setup

### Containerization
- Dockerized application for consistent runtime behavior across environments
- Health endpoints and production-friendly configuration

### Kubernetes Operations
- Deployment manifests with readiness and liveness checks
- Scaling, resource constraints, and disruption protection patterns

### CI/CD Validation
- Automated syntax and configuration checks in GitHub Actions
- Linting and validation steps across app, infrastructure, and config layers

## Prerequisites

Before using this project, ensure the following are installed:

- Terraform >= 1.6
- Ansible >= 2.15
- Docker
- kubectl
- Python >= 3.11
- AWS CLI

## Quick Start

### 1. Clone the repository

```bash
git clone https://github.com/aadiops/infrastructure-automation.git
cd infrastructure-automation
```

### 2. Initialize infrastructure

```bash
cd infra/terraform
terraform init
terraform plan
terraform apply
```

### 3. Provision configuration

```bash
cd ../../ansible
ansible-playbook -i inventory/hosts.ini playbooks/provision.yml
```

### 4. Build the application container

```bash
docker build -t infrastructure-automation:latest .
```

### 5. Deploy on Kubernetes

```bash
kubectl apply -f k8s/deployment.yaml
```

### 6. Run the app locally

```bash
cd app
python3 -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
python app.py
```

## Health Endpoints

The example service exposes several endpoints for monitoring and validation:

- `/` - service root
- `/healthz` - basic health check
- `/readyz` - readiness validation
- `/api/status` - operational status payload
- `/api/metrics` - metrics integration endpoint

## Security Best Practices

- Least privilege IAM model
- Public traffic restricted through defined ingress rules
- Runtime environment configuration via environment variables
- Secrets and credentials should be managed outside source control
- Deployment patterns aligned with cloud-native security practices

